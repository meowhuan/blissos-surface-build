name: Build BlissOS Surface ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '鏋勫缓鍙樹綋 (vanilla / gapps)'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - gapps
      version:
        description: '鍙戝竷鐗堟湰鍚嶏紙濡?r12k锛孯elease tag 鐢級'
        required: false
        default: 'r12k'

jobs:
  build:
    runs-on: [self-hosted, linux, x64, blissos-build]
    timeout-minutes: 240
    steps:
      - name: Checkout 鏈粨搴擄紙鍚?game-compat 鐑慨浜х墿锛?        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 鐜鍑嗗
        run: |
          df -h /
          nproc
          free -g | head -2
          whoami
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

      - name: 璁板綍鏋勫缓鐘舵€侊紙鏋勫缓鏈烘湰鍦颁粨搴撳嵆婧愮爜鐪熺浉锛屼笉閲嶇疆锛?        shell: bash
        run: |
          cd /home/meowhuan/blissos
          # 鏋勫缓鏈烘湰鍦颁粨搴撳氨鏄垜浠殑宸ヤ綔鍓湰锛堝寘鍚湭鎺ㄦ敼鍔ㄧ殑鐜板満锛夛紝鐩存帴鎹鏋勫缓銆?          # 杩欓噷浠呰褰曞悇浠撳簱 HEAD锛屼緵 Release 璇存槑/鎺掓煡鐢ㄣ€?          echo "== 鍚勪粨搴撶姸鎬?=="
          for p in packages/apps/Blissify device/generic/common frameworks/base vendor/bliss build/soong \
                   packages/apps/BlissSystemUI packages/apps/BlissUpdater packages/apps/LMOFreeform \
                   packages/apps/Launcher3 kernel/x86/surface; do
            if [ -d "$p/.git" ]; then
              printf '%-40s %-12s %s\n' "$p" "$(git -C "$p" branch --show-current | head -c12)" "$(git -C "$p" rev-parse --short HEAD)"
            fi
          done
          echo "== 瀛愭ā鍧?=="
          git -C device/generic/common submodule status 2>/dev/null | head

      - name: 搴旂敤娓告垙鍏煎鎬х儹淇紙鏋勫缓鍓嶏級
        shell: bash
        run: |
          cd /home/meowhuan/blissos
          bash "$GITHUB_WORKSPACE/scripts/apply_game_compat.sh"

      - name: 鏋勫缓 ISO
        shell: bash
        run: |
          cd /home/meowhuan/blissos
          export BLISS_BUILD_VARIANT=${{ inputs.variant }}
          export BLISS_RELEASE_VERSION=${{ inputs.version }}
          export BOARD_IS_SURFACE_BUILD=true
          export ANDROID_USE_NDK_TRANSLATION=true
          export https_proxy=http://192.168.31.32:7890
          export http_proxy=http://192.168.31.32:7890
          . build/envsetup.sh
          lunch bliss_x86_64-ap4a-userdebug < /dev/null
          make blissify iso_img -j32 2>&1 | tail -50
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: libvulkan API36 琛ユ晳锛堟瀯寤哄悗蹇呴渶锛?        shell: bash
        run: |
          cd /home/meowhuan/blissos
          GC="$GITHUB_WORKSPACE/game-compat/libvulkan.so.api36"
          MD5=$(md5sum out/target/product/x86_64/system/lib64/libvulkan.so | cut -d' ' -f1)
          echo "pre-fix libvulkan md5: $MD5"
          if [ "${MD5:0:8}" = "59fb1c2b" ]; then
            echo "OK libvulkan 宸蹭负 API36"
          else
            echo "!! libvulkan 涓?API35锛屽簲鐢?API36 琛ユ晳..."
            cp "$GC" out/target/product/x86_64/system/lib64/libvulkan.so
            cp "$GC" obj/PACKAGING/target_files_intermediates/bliss_x86_64-target_files/SYSTEM/lib64/libvulkan.so
            export BOARD_IS_SURFACE_BUILD=true
            export ANDROID_USE_NDK_TRANSLATION=true
            . build/envsetup.sh && lunch bliss_x86_64-ap4a-userdebug < /dev/null
            make iso_img -j32 2>&1 | tail -30
            echo "re-iso exit=$?"
          fi
          MD5=$(md5sum out/target/product/x86_64/system/lib64/libvulkan.so | cut -d' ' -f1)
          echo "post-fix libvulkan md5: $MD5"

      - name: 鏍￠獙 libndk host-call 琛ヤ竵
        shell: bash
        run: |
          cd /home/meowhuan/blissos
          MD5=$(md5sum out/target/product/x86_64/system/lib64/libndk_translation.so | cut -d' ' -f1)
          echo "libndk md5: $MD5"
          case "$MD5" in
            d986d236*) echo "OK host-call 琛ヤ竵宸插寘鍚? ;;
            *) echo "!! libndk 闈炶ˉ涓佺増锛屾父鎴忓吋瀹规€т笉鍙敤" ;;
          esac

      - name: 鎵撳寘鍙戝竷
        shell: bash
        run: |
          cd /home/meowhuan/blissos/out/target/product/x86_64
          ISO=$(ls -t Bliss-*.iso | head -1)
          echo "ISO=$ISO"
          SHA256=$(sha256sum "$ISO" | cut -d' ' -f1)
          echo "SHA256=$SHA256"
          VER=${{ inputs.version }}
          gh release create "$VER" "$ISO" \
            --repo meowhuan/blissos-surface-build \
            --title "BlissOS Surface ${{ inputs.variant }} $VER" \
            --notes "variant: ${{ inputs.variant }}
ISO: $ISO
SHA256: $SHA256
鏋勫缓鏃堕棿: $(date -u +%Y-%m-%dT%H:%M:%SZ)
鈿狅笍 浠呴€傞厤 Surface Pro 9锛涙父鎴忔寜閫愭父鎴忛€傞厤澶勭悊锛堣浠撳簱 README锛? || true
          ls -la "$ISO"
